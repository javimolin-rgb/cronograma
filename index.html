<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F2A44">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cronograma">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=5">
  <meta name="robots" content="noindex, nofollow">
  <title>Cronograma de contenido</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg?v=5" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Mientras arranca -->
  <div id="carga" role="status" aria-label="Cargando">
    <div class="carga-in">
      <span class="logo"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M18 27 H82 V80 H18 Z"/><path d="M18 42 H82"/><path d="M47 42 V80"/><path d="M33 18 V33"/><path d="M67 18 V33"/></svg></span>
      <div class="carga-barra"><i></i></div>
      <span>Cargando el cronograma…</span>
    </div>
  </div>
  <script>setTimeout(function () { var c = document.getElementById('carga'); if (c) c.remove(); }, 20000);</script>

  <!-- ¿Quién eres? -->
  <div id="who" hidden></div>

  <!-- App -->
  <div id="app" hidden>
    <header class="top" id="top"></header>
    <div id="banner"></div>
    <div class="toolbar" id="toolbar"></div>
    <main id="main"></main>
    <button class="fab" data-act="new" aria-label="Nueva pieza">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <nav class="tabs" id="tabs"></nav>
  </div>

  <!-- Hoja inferior (editor, notificaciones, ajustes…) -->
  <div id="sheet" hidden>
    <div class="backdrop" data-act="sheet-close"></div>
    <div class="panel" id="panel"></div>
  </div>

  <div id="lightbox" hidden></div>
  <div id="saving" hidden>Guardando…</div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="zip.js"></script>
  <script src="whatsapp.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
