# Trae el rendimiento de Instagram una vez al día y lo deja en datos/instagram.json.
# El token vive en los secretos del repositorio: no pasa por la página ni por el teléfono.
name: Rendimiento de Instagram

on:
  schedule:
    - cron: '17 11 * * *'   # todos los días (hora UTC; ~8:17 en Chile)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  traer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pedir las métricas a Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node .github/scripts/instagram.mjs
      - name: Guardar lo que cambió
        run: |
          if [ -n "$(git status --porcelain datos/instagram.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add datos/instagram.json
            git commit -m "Rendimiento de Instagram [skip ci]"
            git push
          fi
